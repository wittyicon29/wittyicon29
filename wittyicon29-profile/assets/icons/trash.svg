<svg xmlns="http://www.w3.org/2000/svg" width="100" height="110" viewBox="0 0 100 110" role="img" aria-label="trash">
  <style>
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .meter { transform-box: fill-box; transform-origin: bottom; animation: meter 1.4s ease-in-out infinite; }
    @keyframes meter { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .blink, .meter { animation: none; } }
  </style>
  <rect x="1" y="1" width="98" height="108" rx="14" fill="#161b22" stroke="#30363d"/>
