<svg xmlns="http://www.w3.org/2000/svg" width="100" height="110" viewBox="0 0 100 110" role="img" aria-label="mail">
  <style>
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .meter { transform-box: fill-box; transform-origin: bottom; animation: meter 1.4s ease-in-out infinite; }
    @keyframes meter { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .blink, .meter { animation: none; } }
  </style>
  <rect x="1" y="1" width="98" height="108" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="14" y="20" width="72" height="48" rx="6" fill="#58a6ff"/>
    <path d="M16 23l34 25 34-25" fill="none" stroke="#0b3d91" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="80" cy="22" r="9" fill="#f85149" stroke="#161b22" stroke-width="2.5"/>
    <text x="80" y="26.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">1</text>
  <text x="50" y="96" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#e6edf3">mail</text>
</svg>
