<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">wittyOS boot screen</title>
  <desc id="d">A terminal boots wittyOS, logs in as atharva and runs neofetch: AI/ML engineer at CFOLogic working on speech, LLMs and agents.</desc>
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB9A6"/><stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <clipPath id="type1"><rect x="155" y="58" height="22" width="0">
      <animate attributeName="width" from="0" to="70" begin="5.0s" dur="0.45s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="188" y="132" height="22" width="0">
      <animate attributeName="width" from="0" to="80" begin="6.4s" dur="0.6s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #e6edf3; }
    .l { opacity: 0; animation: on 0.01s steps(1) forwards; }
    @keyframes on { to { opacity: 1; } }
    .boot { animation: off 0.25s ease-in 4.5s forwards; }
    @keyframes off { to { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: center; animation: talk 1.1s ease-in-out infinite; }
    @keyframes talk { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    .caret { animation: on 0.01s steps(1) forwards, blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .l { opacity: 1; animation: none; } .boot { display: none; } .bar { animation: none; }
    }
  </style>

  <rect width="900" height="520" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="519" rx="12" fill="none" stroke="#30363d"/>
  <path d="M0.5 36 V12.5 A12 12 0 0 1 12.5 0.5 H887.5 A12 12 0 0 1 899.5 12.5 V36 Z" fill="#161b22" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#f85149"/><circle cx="42" cy="18" r="6" fill="#F7B32B"/><circle cx="62" cy="18" r="6" fill="#3fb950"/>
  <text x="450.0" y="23" text-anchor="middle" style="font-size:13px;fill:#8b949e">tty1 — wittyOS</text>

  <g class="boot">
    <text class="l" style="animation-delay:0.20s" x="28" y="74" xml:space="preserve">wittyOS 2026.10 (tty1)</text>
    <text class="l" style="animation-delay:0.48s" x="28" y="96" xml:space="preserve">Booting from github.com/wittyicon29 ...</text>
    <text class="l" style="animation-delay:0.76s" x="28" y="118" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Mounted /home/atharva.</text>
    <text class="l" style="animation-delay:1.04s" x="28" y="140" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Loaded kernel module speech_pipeline.ko</text>
    <text class="l" style="animation-delay:1.32s" x="28" y="162" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Loaded kernel module llm_systems.ko</text>
    <text class="l" style="animation-delay:1.60s" x="28" y="184" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Loaded kernel module agents.ko</text>
    <text class="l" style="animation-delay:1.88s" x="28" y="206" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Loaded kernel module interpretable_ml.ko</text>
    <text class="l" style="animation-delay:2.16s" x="28" y="228" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Started stt.service - Streaming transcription.</text>
    <text class="l" style="animation-delay:2.44s" x="28" y="250" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Started tts.service - Text to speech.</text>
    <text class="l" style="animation-delay:2.72s" x="28" y="272" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Started rag.service - Retrieval over papers, PDFs and audio.</text>
    <text class="l" style="animation-delay:3.00s" x="28" y="294" xml:space="preserve">[<tspan fill='#F7B32B'> WARN </tspan>] coffee.service: running low.</text>
    <text class="l" style="animation-delay:3.28s" x="28" y="316" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Started oncall.service - Pager armed.</text>
    <text class="l" style="animation-delay:3.56s" x="28" y="338" xml:space="preserve">[<tspan fill='#3fb950'>  OK  </tspan>] Reached target Curiosity.</text>
  </g>

  <g>
    <text class="l" style="animation-delay:4.8s" x="28" y="74">wittyos login: </text>
    <text x="155" y="74" clip-path="url(#type1)">atharva</text>
    <text class="l" style="animation-delay:5.6s" x="28" y="96">Password: <tspan fill="#8b949e">********</tspan></text>
    <text class="l" style="animation-delay:5.9s" x="28" y="118" fill="#8b949e">Last login: 03:12 from pagerduty</text>
    <text class="l" style="animation-delay:6.2s" x="28" y="148"><tspan fill="#3FB9A6">atharva@wittyos</tspan>:<tspan fill="#58a6ff">~</tspan>$ </text>
    <text x="188" y="148" clip-path="url(#type2)">neofetch</text>
    <g class="l" style="animation-delay:7.2s">
      <text x="290" y="186" font-weight="700"><tspan fill="#3FB9A6">atharva</tspan>@<tspan fill="#3FB9A6">wittyos</tspan></text>
      <text x="290" y="205" fill="#8b949e">---------------</text>
      <text x="290" y="226"><tspan fill="#3FB9A6" font-weight="700">OS</tspan>: wittyOS 2026.10 x86_64</text>
      <text x="290" y="246"><tspan fill="#3FB9A6" font-weight="700">Host</tspan>: CFOLogic</text>
      <text x="290" y="266"><tspan fill="#3FB9A6" font-weight="700">Kernel</tspan>: python (+ c++, java)</text>
      <text x="290" y="286"><tspan fill="#3FB9A6" font-weight="700">Uptime</tspan>: 4 years, 8 months</text>
      <text x="290" y="306"><tspan fill="#3FB9A6" font-weight="700">Packages</tspan>: 74 (github)</text>
      <text x="290" y="326"><tspan fill="#3FB9A6" font-weight="700">Shell</tspan>: zsh</text>
      <text x="290" y="346"><tspan fill="#3FB9A6" font-weight="700">DE</tspan>: speech · LLMs · agents</text>
      <text x="290" y="366"><tspan fill="#3FB9A6" font-weight="700">WM</tspan>: interpretable-ml</text>
      <text x="290" y="386"><tspan fill="#3FB9A6" font-weight="700">Terminal</tspan>: vscode</text>
      <text x="290" y="406"><tspan fill="#3FB9A6" font-weight="700">CPU</tspan>: curiosity (8) @ 3:12 AM</text>
      <text x="290" y="426"><tspan fill="#3FB9A6" font-weight="700">GPU</tspan>: whatever is free on Colab</text>
      <text x="290" y="446"><tspan fill="#3FB9A6" font-weight="700">Latency</tspan>: -30% transcription (Emitrr)</text>
      <rect x="290" y="466" width="24" height="14" fill="#f85149"/>
      <rect x="316" y="466" width="24" height="14" fill="#F7B32B"/>
      <rect x="342" y="466" width="24" height="14" fill="#3fb950"/>
      <rect x="368" y="466" width="24" height="14" fill="#3FB9A6"/>
      <rect x="394" y="466" width="24" height="14" fill="#58a6ff"/>
      <rect x="420" y="466" width="24" height="14" fill="#A371F7"/>
      <rect x="446" y="466" width="24" height="14" fill="#e6edf3"/>
      <rect x="472" y="466" width="24" height="14" fill="#8b949e"/>
      <rect class="bar" style="animation-delay:-0.00s" x="52" y="298" width="9" height="40" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.37s" x="68" y="278" width="9" height="80" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.74s" x="84" y="253" width="9" height="130" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.01s" x="100" y="273" width="9" height="90" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.38s" x="116" y="233" width="9" height="170" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.75s" x="132" y="208" width="9" height="220" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.02s" x="148" y="243" width="9" height="150" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.39s" x="164" y="218" width="9" height="200" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.76s" x="180" y="263" width="9" height="110" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.03s" x="196" y="238" width="9" height="160" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.40s" x="212" y="283" width="9" height="70" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.77s" x="228" y="268" width="9" height="100" rx="4.5" fill="url(#logo)"/>
      <rect class="bar" style="animation-delay:-0.04s" x="244" y="296" width="9" height="44" rx="4.5" fill="url(#logo)"/>
    </g>
    <text class="l" style="animation-delay:7.6s" x="28" y="496"><tspan fill="#3FB9A6">atharva@wittyos</tspan>:<tspan fill="#58a6ff">~</tspan>$ </text><rect class="l caret" style="animation-delay:7.6s,7.6s" x="188" y="482" width="9" height="17" fill="#F7B32B"/>
  </g>
