<svg xmlns="http://www.w3.org/2000/svg" width="100" height="110" viewBox="0 0 100 110" role="img" aria-label="oncall.sh">
  <style>
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .meter { transform-box: fill-box; transform-origin: bottom; animation: meter 1.4s ease-in-out infinite; }
    @keyframes meter { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .blink, .meter { animation: none; } }
  </style>
  <rect x="1" y="1" width="98" height="108" rx="14" fill="#161b22" stroke="#30363d"/>
  <circle cx="50" cy="40" r="30" fill="#f85149" opacity="0.18" class="pulse"/>
    <path d="M32 58V40a18 18 0 0 1 36 0v18z" fill="#f85149"/>
    <rect x="26" y="58" width="48" height="9" rx="3" fill="#b62324"/>
    <rect x="47.5" y="32" width="5" height="15" rx="2.5" fill="#fff"/><circle cx="50" cy="52" r="2.8" fill="#fff"/>
  <text x="50" y="96" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#e6edf3">oncall.sh</text>
</svg>
